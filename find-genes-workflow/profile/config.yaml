#note: this is a sample profile file. You will need to change the paths to match your system.
latency-wait: 300  #how long to wait for files to appear after job completion, in seconds
max-jobs-per-second: 10 #how many jobs to submit per second. This is to avoid overloading the scheduler.
show-failed-logs: True 
jobs: 50 #number of jobs to run in parallel
use-conda: True #use conda environments for each rule
use-envmodules: True #use environment modules for each rule
conda-cleanup-pkgs: cache #clean up conda packages after each rule. This is useful if you have limited disk space. If you have enough disk space, set this to False to avoid re-downloading packages for each rule.
keep-going: True
printshellcmds: True
max-status-checks-per-second: 10
executor: slurm
default-resources:
  runtime: 30
  mem_mb_per_cpu: 2000
  mem_mb: None
  disk_mb: None
  slurm_account: #your slurm account here
set-resources:
  decompress_genome:
    runtime: 5
    mem_mb_per_cpu: 500
    cpus_per_task: 1
    slurm_extra: "'--tmp=500'"
  contig_lengths:
    cpus_per_task: 1
    runtime: 2
    mem_mb_per_cpu: 200
  annotate_bakta:
    cpus_per_task: 8
    runtime: 60 
    mem_mb_per_cpu: 2000
    slurm_extra: "'--tmp=500'"
  tblastn_tra_genes:
      cpus_per_task: 4
      runtime: 5
      mem_mb_per_cpu: 500
      slurm_extra: "'--tmp=500'"
  genomad:
      cpus_per_task: 8
      runtime: 10
      mem_mb_per_cpu: 5000
      slurm_extra: "'--tmp=1000'"
  plasmidfinder:
    runtime: 5
    mem_mb_per_cpu: 500
    cpus_per_task: 1
    slurm_extra: "'--tmp=500'"
  ani_calc:
    runtime: 500
    mem_mb_per_cpu: 1000
    cpus_per_task: 32 
  filter_seq:
    runtime: 5
    mem_mb_per_cpu: 500
    cpus_per_task: 1
    slurm_extra: "'--tmp=500'"
  mob_recon:
    cpus_per_task: 8
    runtime: 15
    mem_mb_per_cpu: 1000
    slurm_extra: "'--tmp=500'"

set-threads:
  decompress_genome: 1
  contig_lengths: 1
  annotate_bakta: 8
  tblastn_tra_genes: 4
  genomad: 8
  plasmidfinder: 1
  ani_calc: 32
  filter_seq: 1
  mob_recon: 8

